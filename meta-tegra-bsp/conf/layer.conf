BBPATH:prepend := "${LAYERDIR}:"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tegra-bsp"
BBFILE_PATTERN_meta-tegra-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tegra-bsp = "6"

LAYERDEPENDS_meta-tegra-bsp = "core"
LAYERSERIES_COMPAT_meta-tegra-bsp = "kirkstone"